name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate mental model schema JSON
        run: python3 -m json.tool 00_CORE/mental_model_schema.json >/dev/null
      - name: Validate mental models index JSON
        run: python3 -m json.tool data/mental_models_index.json >/dev/null
