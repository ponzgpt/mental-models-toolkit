name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: python3 -m json.tool 00_CORE/mental_model_schema.json >/dev/null
      - run: python3 scripts/build_cards.py --check
